name: Build e Release do LiveCapture

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar o exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name LiveCapture
          --add-data "livecapture_gui.py;."
          --add-data "requirements.txt;."
          launcher.py

      - name: Guardar o exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LiveCapture-exe
          path: dist/LiveCapture.exe

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LiveCapture.exe
