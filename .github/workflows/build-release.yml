name: Build e Release do LiveCapture

# Build do executável congelado (PyInstaller, receita da 1.3.0):
#   LiveCapture.exe      — interface gráfica
#   LiveCapture-cli.exe  — modo console (--monitor / --lctool)
#   LiveCapture-portatil.zip — pacote completo (streamlink, yt-dlp e ffmpeg
#                               embutidos; não precisa de Python na máquina)
# Dispara ao enviar uma tag v* e também manualmente (workflow_dispatch).
#
# Nota: as actions abaixo usam Node 24 (checkout@v7, setup-python@v7,
# upload-artifact@v7, action-gh-release@v3).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Criar venv e instalar dependências
        shell: pwsh
        run: |
          python -m venv .venv-livecapture
          & ".\.venv-livecapture\Scripts\python.exe" -m pip install --upgrade pip
          & ".\.venv-livecapture\Scripts\python.exe" -m pip install -r requirements.txt pyinstaller

      - name: Baixar o ffmpeg (vai embutido no pacote)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_bin | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName build_bin\ffmpeg.exe
          Write-Output ("ffmpeg: {0:N1} MB" -f ((Get-Item build_bin\ffmpeg.exe).Length / 1MB))

      - name: Compilar os executáveis (build_livecapture.ps1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build_livecapture.ps1

      - name: Teste de fumaça do CLI embutido
        shell: pwsh
        run: |
          & ".\dist\LiveCapture\LiveCapture-cli.exe" --lctool streamlink --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & ".\dist\LiveCapture\LiveCapture-cli.exe" --lctool yt-dlp --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Guardar o ZIP como artefato
        uses: actions/upload-artifact@v7
        with:
          name: LiveCapture-portatil
          path: LiveCapture-portatil.zip

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: LiveCapture-portatil.zip
