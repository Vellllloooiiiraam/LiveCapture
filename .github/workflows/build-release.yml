name: Build e Release do LiveCapture

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar o exe (sem console)
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name LiveCapture
          --add-data "livecapture_gui.py;."
          --add-data "requirements.txt;."
          launcher.py

      - name: Testar que o exe abre (smoke)
        shell: pwsh
        run: Start-Process -FilePath ".\dist\LiveCapture.exe" -ArgumentList "--check" -Wait

      - name: Baixar o ffmpeg (embutido no ZIP)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName dist\ffmpeg.exe

      - name: Empacotar o ZIP
        shell: pwsh
        run: |
          Copy-Item INSTALACAO.md dist\LEIA-ME.md
          Compress-Archive -Path "dist\LiveCapture.exe", "dist\ffmpeg.exe", "dist\LEIA-ME.md" -DestinationPath dist\LiveCapture.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Guardar o ZIP como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LiveCapture-zip
          path: dist/LiveCapture.zip

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LiveCapture.zip
